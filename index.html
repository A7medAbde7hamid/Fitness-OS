    <script>
      // Compatibility shim for environments where window.fetch has only a getter
      (function () {
        try {
          var target = typeof window !== 'undefined' ? window : self;
          var nativeFetch = target.fetch ? target.fetch.bind(target) : null;
          var currentFetch = nativeFetch;
          
          try {
            Object.defineProperty(target, 'fetch', {
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                currentFetch = fn;
              },
              configurable: true,
              enumerable: true,
            });
          } catch (e1) {
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function () {
                    return currentFetch;
                  },
                  set: function (fn) {
                    currentFetch = fn;
                  },
                  configurable: true,
                  enumerable: true,
                });
              } catch (e2) {}
            }
          }
        } catch (e) {}
      })();
